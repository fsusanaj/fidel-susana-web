<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Fidel Susana</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#F6F5F2" />
  <link rel="icon" type="image/png" href="img/logo-fidel-susana-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Sora:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #0b0b0f; --paper: #f6f5f2; --accent: #3b2eff; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    .wrap { max-width: 520px; }
    .code {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: clamp(4rem, 18vw, 8rem);
      line-height: 1;
      color: var(--accent);
      margin: 0 0 8px;
    }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 0 0 12px; }
    p { margin: 0 0 28px; color: #6c6c76; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    a:hover { background: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace haya cambiado o esté mal escrito. Vuelve al inicio para ver los servicios y contactarme.</p>
    <a href="/fidel-susana-web/">Ir al inicio</a>
  </div>
</body>
</html>
